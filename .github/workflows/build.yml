name: macOS universal app and physical-model tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify universal app
        run: bash macos/build.sh
      - name: Install numerical test dependency
        run: python -m pip install numpy
      - name: Exercise real physical engine and presets
        run: |
          ./build/engine-validation
          ./build/synth-cli --test
          ./build/synth-cli --sweep
          python verify-sound.py
          python tools/verify-sweep.py
      - name: Exercise native Cocoa controls and capture the interface
        run: |
          python - <<'PY'
          import json, subprocess
          subprocess.run(['build/Piano Material Lab.app/Contents/MacOS/PianoMaterialLab', '--self-test'], check=True, timeout=90)
          with open('mac-ui-test.json') as f:
              result = json.load(f)
          assert result['passed'], result
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piano-material-lab-${{ matrix.runner }}
          path: |
            build/Piano-Material-Lab-macOS-universal.zip
            mac-ui-test.png
            mac-ui-test.json
            sound-validation.txt
            engine-validation.txt
            control-sweep.csv
            transition-test.txt
